name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: Lint with selene
        run: selene src

      - name: Build with rojo
        run: rojo build --output Icon.rbxm withLink.project.json
