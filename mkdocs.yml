site_name: TopbarPlus
site_description: Documentation for TopbarPlus v3
site_author: Ben Horton
site_url: https://nanoblox.com/topbarplus/

repo_name: 1ForeverHD/TopbarPlus
repo_url: https://github.com/1ForeverHD/TopbarPlus
edit_uri: edit/main/docs/

# The same settings nanoblox.com/topbarplus uses, so a local preview looks close to it
theme:
  logo: https://nanoblox.com/topbarplus/assets/topbarplus_white.png
  favicon: https://nanoblox.com/topbarplus/assets/favicon.svg
  name: material
  font: false
  palette:
    scheme: slate
    primary: deep purple
    accent: deep purple
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

# This means a local preview can look the same as live site without the theme being in this repo
extra_css:
  - https://nanoblox.com/topbarplus/_shared/fonts.css
  - https://nanoblox.com/topbarplus/_shared/theme.css
  - https://nanoblox.com/topbarplus/_shared/chrome.css
  - https://nanoblox.com/topbarplus/_shared/api-tags.css
  - https://nanoblox.com/topbarplus/_shared/docs.css
  - https://nanoblox.com/topbarplus/stylesheets/topbarplus.css

extra_javascript:
  - javascripts/tags.js
  - javascripts/tabs.js

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/1ForeverHD/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ForeverHD_
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCj9QhyYCvhAwiBHA5B88pYg

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

# nanoblox.com/topbarplus rebuilds from this nav whenever main changes
nav:
  - Docs:
    - Overview:
      - Introduction: index.md
      - Installation: installation.md
      - Third Parties: third_parties.md
    - Reference:
      - Features: features.md
      - API: api.md
    - Other:
      - Contribute: contributing.md
  - Playground: https://www.roblox.com/games/117501901079852/TopbarPlus
  - Model: https://create.roblox.com/store/asset/92368439343389/TopbarPlus
  - Forum: https://forum.hdadmin.com/
  - DevForum: https://devforum.roblox.com/t/topbarplus/1017485
  - Donate: https://www.roblox.com/games/start?placeId=106966695720565
